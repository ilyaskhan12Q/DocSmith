[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsmith-ai"
version = "0.1.0"
description = "AI-powered documentation engineer that analyzes GitHub repos and generates production-ready docs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "DocSmith Contributors" },
]
keywords = [
    "documentation",
    "github",
    "ai",
    "cli",
    "readme",
    "generator",
    "llm",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "requests>=2.31.0",
    "pyperclip>=1.8.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.5.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
mistral = ["mistralai>=0.1.0"]
all-providers = [
    "google-generativeai>=0.5.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "mistralai>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[project.scripts]
docsmith = "docsmith.main:app"

[project.urls]
Homepage = "https://github.com/docsmith-ai/docsmith"
Documentation = "https://github.com/docsmith-ai/docsmith#readme"
Repository = "https://github.com/docsmith-ai/docsmith"
Issues = "https://github.com/docsmith-ai/docsmith/issues"
Changelog = "https://github.com/docsmith-ai/docsmith/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["docsmith"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "B904", "SIM102", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["docsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["docsmith"]
omit = ["tests/*"]
